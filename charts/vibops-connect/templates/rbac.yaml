{{- if .Values.rbac.create }}
{{- if .Values.rbac.clusterRole }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vibops-connect.fullname" . }}
  labels:
    {{- include "vibops-connect.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "nodes", "services", "endpoints", "namespaces", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # La mesure de consommation lit dcgm-exporter a travers le proxy du serveur
  # d'API, ce qui est une ressource distincte de `services` : lister le service
  # ne donne pas le droit de le traverser. Sans cette ligne, le collecteur
  # recevait « cannot get resource services/proxy » et rendait None — la meme
  # valeur que « pas d'exporteur ». La fonctionnalite etait donc inatteignable
  # telle qu'installee par le chart. Constate le 30/09/2026 sur une L4.
  #
  # En lecture seule, et seulement sur le proxy : le gateway ne peut ni creer
  # ni modifier de service.
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]
{{- if .Values.rbac.allowWrite }}
  # ── Ecriture (rbac.allowWrite) ──────────────────────────────────────────────
  #
  # Volontaire et nomme. Sans ces verbes, VibOps observe et n'agit pas : un
  # `kubectl scale` ou un `helm upgrade` lance par un job est refuse par l'API
  # server, et le job echoue sur « forbidden » — ce qui ressemble a un defaut du
  # produit et n'en est pas un.
  #
  # Trois choses restent volontairement absentes, et ce sont les trois qui
  # transformeraient une passerelle en pivot :
  #   * `secrets` — lire les secrets du cluster n'est pas necessaire pour
  #     deployer, et une passerelle compromise les exfiltrerait toutes ;
  #   * `rbac.authorization.k8s.io` — une passerelle qui peut s'accorder des
  #     droits n'a plus de limite, et ce plafond-la ne se rattrape pas ;
  #   * `nodes` en ecriture — cordon et drain touchent la capacite du site, pas
  #     une charge de travail. A accorder a la main si le besoin apparait.
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vibops-connect.fullname" . }}
  labels:
    {{- include "vibops-connect.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vibops-connect.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vibops-connect.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vibops-connect.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibops-connect.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
{{- if .Values.rbac.allowWrite }}
  # Meme intention qu'au-dessus, bornee au namespace du release.
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vibops-connect.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibops-connect.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vibops-connect.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vibops-connect.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
