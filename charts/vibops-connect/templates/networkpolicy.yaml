{{- $np := .Values.networkPolicy | default dict }}
{{- if ne $np.enabled false }}
# Measured on 21/10/2026, from inside a running gateway: a TCP connection to
# arbitrary public hosts on 443 succeeded, and so did one to the link-local
# address that carries instance metadata on several clouds. No NetworkPolicy
# existed anywhere on that cluster, because this chart shipped none. ADR 0054
# counted it as one of three gaps.
#
# What this policy does, and deliberately does not do:
#
#   * **Ingress is denied entirely.** Nothing needs to reach the gateway — it
#     polls core outward and this chart ships no Service. This half is free.
#   * **Egress stays open, minus the metadata range.** A gateway's job is to
#     talk to infrastructure: core over HTTPS at an address the customer
#     chooses, a Kubernetes API server, and whatever a connector reaches — a
#     vCenter, a Proxmox, a BMC, a cloud API, on RFC1918 or on the public
#     internet. A deny-by-default egress list that we wrote would be wrong at
#     the first site and would fail as a network fault rather than a
#     configuration one. What *is* safe to cut, everywhere, is the link-local
#     range: no connector has any business there, and it is the classic
#     credential path out of a compromised pod.
#
# A site that wants a tighter egress sets `networkPolicy.egressExcept` to its
# own list, or disables this and ships its own policy. And whether any of it is
# enforced depends on the CNI, which is the customer's choice — which is an
# argument for shipping the policy, not for omitting it: a policy the CNI
# ignores changes nothing, and one it honours closes a real path.
# **Why the nil-safe form, measured the hard way.** The first version of this
# template read `.Values.networkPolicy.enabled` directly. On 21/10/2026 the very
# first `helm upgrade --reuse-values` against an existing release failed with
# `nil pointer evaluating interface {}.enabled`: Helm reuses the previous
# release's values, where a key this chart had just invented does not exist. The
# upgrade was refused rather than applied, which is the correct failure — but it
# would have refused at every customer site too.
#
# So absence is read as the chart's own default, enabled, rather than as nil.
# A site that wants it off sets `networkPolicy.enabled: false` explicitly, and
# `ne $np.enabled false` honours that while an upgrade that never mentioned the
# key still gets the policy. Same reasoning for `egressExcept`: an upgraded
# release that never set it still loses the metadata range.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vibops-connect.fullname" . }}
  labels:
    {{- include "vibops-connect.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vibops-connect.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # No ingress rule at all, which is how a deny is written here.
  ingress: []
  egress:
    # DNS, named separately so it survives a site tightening `egressExcept`
    # to something that would otherwise exclude the cluster's resolver.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with $np.egressExcept | default (list "169.254.0.0/16") }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
{{- end }}
