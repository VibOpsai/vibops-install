# Refuse to run a VibOps image that we did not sign.
#
# Every image is signed at its digest by the release workflow, and the
# installation guide gives the `cosign verify` command — but a verification an
# operator has to remember is a verification that does not happen. This is the
# same check, enforced by the cluster on every pod, including the ones created
# at three in the morning by an autoscaler.
#
# It is not installed by the chart: it needs Kyverno, which is a cluster-wide
# decision that belongs to whoever runs the cluster, not to an application
# chart. Apply it yourself:
#
#   kubectl apply -f helm/vibops/policies/kyverno-verify-images.yaml
#
# It enforces. It shipped in `Audit` first — a policy that refuses on a running
# cluster before anyone has seen what it would refuse is a policy that gets
# deleted in a hurry during an incident — and the audit was run on 22/09/2026
# against the published images, by digest:
#
#   core, agent, console, connect, worker, llm-proxy — signed at v0.45.11
#
# Those are every image the chart and the compose file actually deploy that
# matches the pattern below. Redis and PostgreSQL come from Docker Hub and are
# not matched by the rule, so they are unaffected.
#
# Two consequences of `Enforce` worth knowing before you apply it:
#
#   - An image published without a signature is refused. If you build your own
#     VibOps images, sign them with the same identity or narrow
#     `imageReferences` to the ones we publish.
#   - `failurePolicy: Fail` now bites. A cluster that cannot reach ghcr or
#     Rekor refuses new pods rather than admitting unverified ones. That is the
#     intended trade — an open door during an outage is still an open door —
#     but it is a real coupling to two external services, and an air-gapped
#     cluster needs a mirrored Rekor or this policy removed.
#
# What it verifies is not "somebody signed this" but "this was built by the
# VibOps release workflow, in the VibOps repository, at a tag" — the identity
# in the certificate. Without `subject` and `issuer`, anyone with a Sigstore
# account satisfies the rule.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: vibops-verify-images
  annotations:
    policies.kyverno.io/title: Verify VibOps image signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Every ghcr.io/davidmacamara-boop/vibops-* image must carry a keyless
      cosign signature issued to the VibOps release workflow. Unsigned images,
      images signed by anyone else, and images whose digest does not match the
      signature are refused.
spec:
  validationFailureAction: Enforce   # audit ran clean 22/09/2026 — see the header
  background: false                # signature checks need the registry
  webhookTimeoutSeconds: 30
  failurePolicy: Fail              # a broken verifier must not become an open door
  rules:
    - name: verify-vibops-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/davidmacamara-boop/vibops-*"
          # Kyverno rewrites the reference to the digest it verified, so the pod
          # runs exactly what was checked — not whatever the tag points at by
          # the time the kubelet pulls.
          mutateDigest: true
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/davidmacamara-boop/vibops/.github/workflows/release-images.yml@refs/tags/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
