{{- if dig "enabled" true .Values.redis }}
{{/*
  Redis, bundled like PostgreSQL.

  The chart shipped a PostgreSQL subchart and no broker, while `core.secret.redisUrl`
  said "REQUIRED in production" and defaulted to localhost. Celery needs a broker, so
  a chart installed as documented never became healthy — and nothing explained why one
  stateful dependency was bundled and the other was not.

  The official `redis:7-alpine`, the same image the compose deployment has always used,
  rather than a Bitnami subchart: Bitnami pruned its free Docker Hub catalogue and that
  is precisely what broke PostgreSQL here on 20/09/2026.

  Set `redis.enabled: false` and point `core.secret.redisUrl` at your own instance when
  you have one — a managed broker is the right answer in production, and this is the
  right answer for everyone else.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vibops.fullname" . }}-redis
  labels:
    {{- include "vibops.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "vibops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "vibops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "{{ dig "image" "repository" "redis" .Values.redis }}:{{ dig "image" "tag" "7-alpine" .Values.redis }}"
          imagePullPolicy: IfNotPresent
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--appendonly"
            - "no"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vibops.fullname" . }}-redis
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml (dig "resources" (dict "requests" (dict "cpu" "50m" "memory" "64Mi") "limits" (dict "cpu" "500m" "memory" "256Mi")) .Values.redis) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vibops.fullname" . }}-redis
  labels:
    {{- include "vibops.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "vibops.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vibops.fullname" . }}-redis
  labels:
    {{- include "vibops.labels" . | nindent 4 }}
type: Opaque
stringData:
  # No default. An empty password means `--requirepass ` with no argument, which
  # is no authentication at all — worse than the weak default removed from the
  # compose file on 20/09/2026.
  REDIS_PASSWORD: {{ required "redis.auth.password is required — generate one with `openssl rand -hex 24`, or set redis.enabled=false and point core.secret.redisUrl at your own broker" (dig "auth" "password" "" .Values.redis) | quote }}
{{- end }}
