apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vibops.fullname" . }}-core
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibops.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.core.secret.secretKey | quote }}
  JWT_SECRET_KEY: {{ .Values.core.secret.jwtSecretKey | quote }}
  AUTH_USERNAME: {{ .Values.core.secret.authUsername | quote }}
  AUTH_PASSWORD_HASH: {{ .Values.core.secret.authPasswordHash | quote }}
  DATABASE_URL: {{ include "vibops.databaseUrl" . | quote }}
  REDIS_URL: {{ .Values.core.secret.redisUrl | default "redis://localhost:6379/0" | quote }}
  VAULT_KEY: {{ .Values.core.secret.vaultKey | quote }}
  INTERNAL_API_KEY: {{ .Values.core.secret.internalApiKey | quote }}
  # Both are required when APP_ENV=production: core/app/main.py refuses to start
  # without them, because an empty webhook secret accepts any source. The chart
  # exposed neither, so a `helm install` following the guide produced a core in
  # CrashLoopBackOff and every pod behind it. The refusal is correct; the chart
  # simply gave no way to satisfy it.
  GITHUB_WEBHOOK_SECRET: {{ .Values.core.secret.githubWebhookSecret | default "" | quote }}
  GRAFANA_WEBHOOK_SECRET: {{ .Values.core.secret.grafanaWebhookSecret | default "" | quote }}
  VIBOPS_LICENCE_KEY: {{ .Values.core.secret.licenceKey | default "" | quote }}
