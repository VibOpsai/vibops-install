apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vibops.fullname" . }}-core
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibops.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ include "vibops.prodSecret" (dict "ctx" . "value" .Values.core.secret.secretKey "message" "core.secret.secretKey is required when APP_ENV=production — a Fernet key from `scripts/gen-fernet-key.sh` or the cryptography package") | quote }}
  JWT_SECRET_KEY: {{ include "vibops.prodSecret" (dict "ctx" . "value" .Values.core.secret.jwtSecretKey "message" "core.secret.jwtSecretKey is required when APP_ENV=production — generate one with `openssl rand -hex 32`") | quote }}
  AUTH_USERNAME: {{ .Values.core.secret.authUsername | quote }}
  AUTH_PASSWORD_HASH: {{ .Values.core.secret.authPasswordHash | quote }}
{{- if not .Values.postgresql.enabled }}
  # Only for a database you run yourself. When the chart bundles PostgreSQL the
  # URL is composed in the pod from the subchart's own Secret — see
  # `vibops.databaseEnv` — so there is never a second copy of the password.
  DATABASE_URL: {{ include "vibops.databaseUrl" . | quote }}
{{- end }}
  # Defaults to the bundled Redis rather than localhost, which was never right:
  # nothing listens on localhost inside the core pod.
  REDIS_URL: {{ .Values.core.secret.redisUrl | default (printf "redis://:%s@%s-redis:6379/0" (dig "auth" "password" "" .Values.redis) (include "vibops.fullname" .)) | quote }}
  VAULT_KEY: {{ include "vibops.prodSecret" (dict "ctx" . "value" .Values.core.secret.vaultKey "message" "core.secret.vaultKey is required when APP_ENV=production — a Fernet key from `scripts/gen-fernet-key.sh` or the cryptography package") | quote }}
  INTERNAL_API_KEY: {{ include "vibops.prodSecret" (dict "ctx" . "value" .Values.core.secret.internalApiKey "message" "core.secret.internalApiKey is required when APP_ENV=production — generate one with `openssl rand -hex 32`") | quote }}
  # Both are required when APP_ENV=production: core/app/main.py refuses to start
  # without them, because an empty webhook secret accepts any source. The chart
  # exposed neither, so a `helm install` following the guide produced a core in
  # CrashLoopBackOff and every pod behind it. The refusal is correct; the chart
  # simply gave no way to satisfy it.
  GITHUB_WEBHOOK_SECRET: {{ include "vibops.prodSecret" (dict "ctx" . "value" .Values.core.secret.githubWebhookSecret "message" "core.secret.githubWebhookSecret is required when APP_ENV=production — an empty webhook secret accepts any source. Generate one with `openssl rand -hex 32`") | quote }}
  GRAFANA_WEBHOOK_SECRET: {{ include "vibops.prodSecret" (dict "ctx" . "value" .Values.core.secret.grafanaWebhookSecret "message" "core.secret.grafanaWebhookSecret is required when APP_ENV=production — an empty webhook secret accepts any source. Generate one with `openssl rand -hex 32`") | quote }}
  VIBOPS_LICENCE_KEY: {{ .Values.core.secret.licenceKey | default "" | quote }}
