apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vibops.fullname" . }}-core
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibops.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Signs the audit chain. A new key does not re-sign what is already
  # written, so the live value wins over anything supplied later.
  SECRET_KEY: {{ include "vibops.preserved" (dict "ctx" . "secret" (printf "%s-core" (include "vibops.fullname" .)) "key" "SECRET_KEY" "value" .Values.core.secret.secretKey "pinned" true "generate" (randAlphaNum 48)) | quote }}
  # Rotatable: a new key only invalidates sessions. The agent reads this
  # same Secret rather than holding a copy.
  JWT_SECRET_KEY: {{ include "vibops.preserved" (dict "ctx" . "secret" (printf "%s-core" (include "vibops.fullname" .)) "key" "JWT_SECRET_KEY" "value" .Values.core.secret.jwtSecretKey "generate" (randAlphaNum 48)) | quote }}
  AUTH_USERNAME: {{ .Values.core.secret.authUsername | quote }}
  AUTH_PASSWORD_HASH: {{ .Values.core.secret.authPasswordHash | quote }}
{{- if not .Values.postgresql.enabled }}
  # Only for a database you run yourself. When the chart bundles PostgreSQL the
  # URL is composed in the pod from the subchart's own Secret — see
  # `vibops.databaseEnv` — so there is never a second copy of the password.
  DATABASE_URL: {{ include "vibops.databaseUrl" . | quote }}
{{- end }}
{{- if not .Values.redis.enabled }}
  # Only for a broker you run yourself. The bundled one is composed in the pod
  # from the Secret that owns the password — see `vibops.redisEnv`.
  REDIS_URL: {{ required "core.secret.redisUrl is required when redis.enabled=false" .Values.core.secret.redisUrl | quote }}
{{- end }}
  # Fernet key encrypting stored secrets. Changing it makes every one of
  # them undecryptable, so the live value wins.
  VAULT_KEY: {{ include "vibops.preserved" (dict "ctx" . "secret" (printf "%s-core" (include "vibops.fullname" .)) "key" "VAULT_KEY" "value" .Values.core.secret.vaultKey "pinned" true "generate" (randAlphaNum 32 | b64enc | replace "+" "-" | replace "/" "_")) | quote }}
  INTERNAL_API_KEY: {{ include "vibops.preserved" (dict "ctx" . "secret" (printf "%s-core" (include "vibops.fullname" .)) "key" "INTERNAL_API_KEY" "value" .Values.core.secret.internalApiKey "generate" (randAlphaNum 48)) | quote }}
  # core/app/main.py refuses to start without these when APP_ENV=production,
  # because an empty webhook secret accepts any source. Generated here, so the
  # refusal has nothing left to refuse.
  GITHUB_WEBHOOK_SECRET: {{ include "vibops.preserved" (dict "ctx" . "secret" (printf "%s-core" (include "vibops.fullname" .)) "key" "GITHUB_WEBHOOK_SECRET" "value" .Values.core.secret.githubWebhookSecret "generate" (randAlphaNum 48)) | quote }}
  GRAFANA_WEBHOOK_SECRET: {{ include "vibops.preserved" (dict "ctx" . "secret" (printf "%s-core" (include "vibops.fullname" .)) "key" "GRAFANA_WEBHOOK_SECRET" "value" .Values.core.secret.grafanaWebhookSecret "generate" (randAlphaNum 48)) | quote }}
  VIBOPS_LICENCE_KEY: {{ .Values.core.secret.licenceKey | default "" | quote }}
