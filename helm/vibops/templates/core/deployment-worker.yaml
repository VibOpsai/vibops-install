{{- if .Values.core.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vibops.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibops.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "vibops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "vibops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- include "vibops.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "vibops.fullname" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.core.kubeconfig.secretName }}
        - name: kubeconfig
          secret:
            secretName: {{ .Values.core.kubeconfig.secretName }}
            defaultMode: 0400
        {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.images.core.repository }}:{{ .Values.images.core.tag }}"
          imagePullPolicy: {{ .Values.images.core.pullPolicy }}
          command: ["/entrypoint.sh", "worker"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "vibops.fullname" . }}-core
          env:
            - name: APP_ENV
              value: {{ .Values.core.env.APP_ENV | quote }}
            {{- if .Values.core.kubeconfig.secretName }}
            - name: KUBECONFIG
              value: {{ .Values.core.kubeconfig.mountPath }}/config
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.core.kubeconfig.secretName }}
            - name: kubeconfig
              mountPath: {{ .Values.core.kubeconfig.mountPath }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
