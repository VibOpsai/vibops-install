{{- $remote := dig "backup" "remote" dict .Values.postgresql }}
{{- if and .Values.postgresql.enabled (dig "backup" "enabled" true .Values.postgresql) (dig "enabled" false $remote) (not (dig "existingSecret" "" $remote)) }}
{{/*
  The off-host destination, as rclone's own environment variables.

  Nothing in this chart models S3 versus SFTP versus Azure. rclone reads a
  remote called `offsite` from `RCLONE_CONFIG_OFFSITE_*`, so whatever the
  operator puts in this map is the backend, and a new provider needs no chart
  change. `docs/installation.md` lists the keys for the common targets.

  Two ways in, and the first is better:

    * `remote.existingSecret` — a Secret you created yourself. Nothing reaches
      a values file, and nothing reaches `helm get values` or the release
      history, which a `--set` credential does.
    * `remote.config` — this map, rendered here. Convenient, and the
      credential then lives in the release history for as long as the release
      does. Use it for a pilot, not for production.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vibops.fullname" . }}-backup-remote
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibops.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
type: Opaque
stringData:
  {{- range $k, $v := (dig "config" dict $remote) }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
