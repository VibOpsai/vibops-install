{{- $e := dig "backup" "encryption" dict .Values.postgresql }}
{{- if and .Values.postgresql.enabled (dig "backup" "enabled" true .Values.postgresql) (dig "enabled" true $e) (not (dig "existingSecret" "" $e)) }}
{{/*
  La clef qui chiffre les sauvegardes.

  `pinned`, comme VAULT_KEY : la valeur vivante dans le cluster gagne sur tout
  ce qu'un fichier de valeurs pourrait proposer ensuite. Une clef qui change
  rend indechiffrable tout ce qui a ete ecrit avec la precedente, et une
  sauvegarde indechiffrable n'est pas une sauvegarde — c'est un fichier.

  ET C'EST LE PIEGE DE CE FICHIER. Le chart genere cette clef et la conserve
  pour la duree de la release ; elle ne vit nulle part ailleurs. Supprimer le
  namespace emporte la clef, tandis que le volume de sauvegarde, lui, survit
  (`helm.sh/resource-policy: keep`) et les copies hors machine aussi. On se
  retrouve alors avec trente jours d'archives et rien pour les ouvrir.

  C'est pourquoi NOTES.txt imprime la commande d'export a chaque install et a
  chaque upgrade, et pourquoi la section Sauvegardes du manuel en fait une
  etape et non une note de bas de page. Le defaut est sur « chiffre » parce
  qu'un produit doit etre sur par defaut ; la contrepartie est que l'exploitant
  doit mettre cette clef en securite le jour de l'installation.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vibops.fullname" . }}-backup-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibops.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  annotations:
    # La clef survit a `helm uninstall`, comme le volume qu'elle protege. Les
    # deux partent ensemble avec le namespace, et pas autrement : une
    # desinstallation qui garde les archives et jette la clef ne garde rien.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  BACKUP_PASSPHRASE: {{ include "vibops.preserved" (dict "ctx" . "secret" (printf "%s-backup-key" (include "vibops.fullname" .)) "key" "BACKUP_PASSPHRASE" "value" (dig "passphrase" "" $e) "pinned" true "generate" (randAlphaNum 48)) | quote }}
{{- end }}
