{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vibops.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibops.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "vibops.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vibops.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibops.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Generated on first install and kept for the life of the release. Pinned:
  # the server is initialised with this password and a later change would leave
  # it on the old one — the divergence v0.45.4 removed.
  POSTGRES_PASSWORD: {{ include "vibops.preserved" (dict
      "ctx" .
      "secret" (printf "%s-db" (include "vibops.fullname" .))
      "key" "POSTGRES_PASSWORD"
      "value" (dig "auth" "password" "" .Values.postgresql)
      "pinned" true
      "generate" (randAlphaNum 32)) | quote }}
  # The application role's password (ADR 0047). Generated on first install and
  # kept: the role is created with it by the `grant-app-role` init container,
  # and rotating it here without rotating it on the role would leave every pod
  # unable to connect. Not pinned to a value in values.yaml — nobody should
  # have to type this one.
  APP_ROLE_PASSWORD: {{ include "vibops.preserved" (dict
      "ctx" .
      "secret" (printf "%s-db" (include "vibops.fullname" .))
      "key" "APP_ROLE_PASSWORD"
      "value" ""
      "pinned" true
      "generate" (randAlphaNum 32)) | quote }}
{{- end }}
