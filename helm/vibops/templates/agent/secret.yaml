apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vibops.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibops.labels" . | nindent 4 }}
type: Opaque
stringData:
  LLM_API_KEY: {{ .Values.agent.secret.llmApiKey | default "" | quote }}
  LLM_BASE_URL: {{ .Values.agent.secret.llmBaseUrl | default "" | quote }}
  # Defaults to core's: the agent validates tokens core signs. Two independent
  # "change-me-jwt-secret" defaults agreed by accident; the moment one side
  # was set properly, the other kept rejecting every call with a 401.
  JWT_SECRET_KEY: {{ include "vibops.prodSecret" (dict "ctx" . "value" (.Values.agent.secret.jwtSecretKey | default .Values.core.secret.jwtSecretKey) "message" "core.secret.jwtSecretKey is required when APP_ENV=production — the agent signs with the same key") | quote }}
  CORE_API_URL: {{ printf "http://%s-core:%d" (include "vibops.fullname" .) (.Values.core.service.port | int) | quote }}
