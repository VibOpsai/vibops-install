# VibOps Helm Chart — values par défaut
# Surcharger avec: helm install vibops ./helm/vibops -f my-values.yaml

global:
  imageRegistry: ""          # ex: registry.mycompany.com
  imagePullSecrets: []

# ── Registry credentials (private OCI registry) ───────────────────────────────
# Creates a kubernetes.io/dockerconfigjson Secret and injects it as imagePullSecret
imageCredentials:
  enabled: true
  registry: ghcr.io
  username: vibops-deploy    # pull-only service account
  password: ""               # set in values.secret.yaml (SOPS-encrypted)

# ── Images ────────────────────────────────────────────────────────────────────
# Le nom publie est `ghcr.io/<owner>/vibops-<composant>` — voir
# .github/workflows/release-images.yml, ou REGISTRY vaut
# `ghcr.io/${{ github.repository_owner }}/vibops` et le nom du composant est
# accole avec un tiret. `ghcr.io/vibops/core` n'a jamais existe : un chart qui
# le reference s'installe sans erreur et reste bloque en ImagePullBackOff.
#
# tag vide = la version applicative du chart (appVersion), comme
# charts/vibops-connect. Poser "latest" ici ferait ignorer appVersion et
# livrerait une version differente de celle que le chart annonce.
# Set `digest: sha256:…` on any of these and it wins over the tag. The chart
# published with each release carries digests, resolved from the registry after
# the images exist; this file keeps tags so a local build still runs.
images:
  core:
    repository: ghcr.io/davidmacamara-boop/vibops-core
    tag: ""
    digest: "sha256:d0e0eeeb710337e0cca2efd9d58e488dbf7901656284ea778433b2c0ef935c24"
    pullPolicy: IfNotPresent
  agent:
    repository: ghcr.io/davidmacamara-boop/vibops-agent
    tag: ""
    digest: "sha256:087401fc15b0d46af62bb0cd1bf40897e4b230ce7be76eeeebca76150f714ce5"
    pullPolicy: IfNotPresent
  console:
    repository: ghcr.io/davidmacamara-boop/vibops-console
    tag: ""
    digest: "sha256:472d7086a3b9c6e2dc11439ffe8a41cf89df41531111ffa76bd967be547f5615"
    pullPolicy: IfNotPresent

# ── Namespace ─────────────────────────────────────────────────────────────────
namespaceOverride: ""   # défaut: release namespace

# ── Core (Execution Engine) ───────────────────────────────────────────────────
core:
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

  service:
    type: ClusterIP
    port: 8000

  env:
    APP_ENV: production
    OTEL_EXPORTER_OTLP_ENDPOINT: ""   # ex: http://otel-collector:4317
    # Surcharger les secrets via core.secret.*

  # Every secret below is generated by the chart on first install and kept for
  # the life of the release. Leave them empty — that is the supported path, and
  # a generated 48-character value beats anything typed into a terminal. Set
  # one only to impose your own; it is then used from that install onward.
  #
  # Two are pinned once written, because changing them breaks what they
  # protect: vaultKey (decrypts stored secrets) and secretKey (signs the audit
  # chain, and a new key does not re-sign what is already written).
  secret:
    secretKey: ""          # generated — signs the audit chain, pinned once set
    jwtSecretKey: ""       # generated — the agent reads this same Secret
    authPasswordHash: ""   # vide = auth désactivée

    # ── Email / SMTP ─────────────────────────────────────────────────────────
    # Requis pour la reinitialisation de mot de passe en mode multi-utilisateur.
    # Core lit `smtp_host`, `smtp_port`, `smtp_user`, `smtp_password`,
    # `smtp_from` depuis toujours ; le chart ne les posait nulle part et le
    # manuel d'installation demandait pourtant de les renseigner ici. Un client
    # qui suivait le manuel configurait un SMTP que rien ne lisait, et
    # decouvrait le probleme au premier « mot de passe oublie ». Corrige le
    # 01/10/2026, meme forme que la cle de licence une heure plus tot.
    smtpHost: ""
    smtpPort: "587"
    smtpUser: ""
    smtpPassword: ""
    smtpFrom: ""
    databaseUrl: ""        # only when postgresql.enabled=false
    redisUrl: ""           # only when redis.enabled=false
    vaultKey: ""           # generated Fernet key — pinned once set
    internalApiKey: ""     # generated — service-to-service auth
    # Generated. core/app/main.py refuses to start in production without them,
    # since an empty webhook secret accepts any source.
    githubWebhookSecret: ""
    grafanaWebhookSecret: ""
    # Licence VibOps — laisser vide pour trial 14 jours
    # Obtenir une clé : contacter david@vibops.ai
    # La clé est un JWT RS256 signé par VibOps. Aucun secret partagé requis côté client.
    licenceKey: ""

  # Kubeconfig multi-cluster — monté dans le pod core pour le sélecteur de contexte
  # Créer le secret avec : kubectl create secret generic vibops-kubeconfig \
  #   --from-file=config=$HOME/.kube/config -n vibops
  kubeconfig:
    secretName: ""          # nom du secret K8s contenant la clé "config"
    mountPath: /home/vibops/.kube  # chemin de montage dans le pod

# ── Worker (Celery) ──────────────────────────────────────────────────────────
worker:
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

# ── Agent ─────────────────────────────────────────────────────────────────────
agent:
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

  service:
    type: ClusterIP
    port: 8001

  persistence:
    enabled: true
    size: 10Gi
    # Vide = la classe par defaut du cluster, comme pour les deux autres volumes
    # du chart. La valeur etait « standard » en dur : ce nom n'existe que sur
    # certains clusters (minikube, GKE historique). Sur Scaleway, OVH, EKS ou
    # tout cluster dont la classe par defaut porte un autre nom, le PVC restait
    # Pending et le pod agent ne demarrait jamais — sans message ailleurs que
    # dans `kubectl get pvc`. Constate le 01/10/2026 en deroulant le manuel sur
    # un Kapsule, ou la classe par defaut s'appelle `sbs-default`.
    storageClassName: ""
    accessMode: ReadWriteOnce    # ReadWriteMany si plusieurs replicas (EFS)

  env:
    # LLM provider: claude (default) | openai (on-prem: vLLM, Mistral…) | ollama | nemotron
    LLM_PROVIDER: "claude"
    # Model name — interpreted by the active provider
    # claude:   claude-sonnet-4-6, claude-opus-4-6
    # openai:   glm-4, mistral-7b, llama3
    # ollama:   llama3:8b, mistral:7b
    # nemotron: nvidia/llama-3.1-nemotron-ultra-253b-v1
    LLM_MODEL: "claude-sonnet-4-6"
    # On-prem OpenAI-compatible endpoint (required when LLM_PROVIDER=openai)
    LLM_BASE_URL: ""      # e.g. http://glm-service.ai-infra.svc:8000/v1 (openai provider only)
    LLM_API_KEY: ""       # set here only if not using secret.llmApiKey
    # Ollama endpoint (required when LLM_PROVIDER=ollama)
    OLLAMA_BASE_URL: "http://ollama:11434"
    # NVIDIA NIM endpoint (required when LLM_PROVIDER=nemotron)
    NEMOTRON_BASE_URL: "http://nim:8000/v1"

  secret:
    # API key for the active LLM provider.
    # - claude (Anthropic): get a key at https://console.anthropic.com/settings/keys
    # - openai / on-prem: your provider's API key (leave empty if no auth required)
    # - ollama / nemotron: leave empty (on-prem NIM needs no auth)
    llmApiKey: ""
    # Base URL — required only when LLM_PROVIDER=openai (on-prem endpoint).
    # Example: http://vllm-service.ai-infra.svc:8000/v1
    # Leave empty for claude, ollama, or nemotron.
    llmBaseUrl: ""
    # Leave empty: it then takes core.secret.jwtSecretKey. The agent validates
    # tokens core signs, so two different values is a silent 401, not a warning.
    jwtSecretKey: ""

# ── Console (UI) ──────────────────────────────────────────────────────────────
console:
  # Conversation history lives in SQLite at /data. Without this the console
  # cannot write at all under readOnlyRootFilesystem, and an emptyDir would
  # discard every conversation on restart — which the compose deployment never
  # did, since it mounts a named volume there.
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""   # empty = the cluster's default
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  service:
    type: ClusterIP
    port: 8003

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: "nginx"
  # Where the Ingress controller runs. The NetworkPolicies admit only the pods
  # that need each service, and a controller in another namespace is admitted by
  # none of them — so enabling ingress without naming its namespace publishes
  # routes that time out. Matched on `kubernetes.io/metadata.name`, which
  # Kubernetes sets on every namespace by itself.
  controllerNamespace: ingress-nginx
  annotations: {}
  host: vibops.example.com
  tls: []
  # tls:
  #   - secretName: vibops-tls
  #     hosts:
  #       - vibops.example.com

# ── PostgreSQL (Bitnami sub-chart) ────────────────────────────────────────────
# ── Redis (Celery broker) ────────────────────────────────────────────────────
# Bundled like PostgreSQL. The chart used to ship the database and not the
# broker, while core.secret.redisUrl said "REQUIRED in production" and defaulted
# to localhost — so an install following the guide never became healthy, and
# nothing explained why one stateful dependency was bundled and the other not.
#
# The official image rather than a Bitnami subchart: Bitnami pruned its free
# Docker Hub catalogue, which is exactly what broke PostgreSQL here on
# 20/09/2026.
redis:
  enabled: true
  auth:
    password: ""   # generated on install, kept on upgrade — leave it empty
  image:
    repository: redis
    tag: "7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

postgresql:
  enabled: true

  # The official image, the same one the compose deployment has always used.
  # The Bitnami subchart is gone: Bitnami pruned its free Docker Hub catalogue
  # in August 2026, the pinned tag began returning "not found" mid-install, and
  # the surviving `bitnamilegacy` copy receives no updates at all — security
  # ones included. One image to follow instead of two, and the CVE scan sees it.
  image:
    # Override it for an air-gapped site — docs/installation.md lists every
    # image to mirror.
    repository: postgres
    # Pinned by digest: a tag is a moving pointer, a digest is the content.
    tag: "16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea"
    pullPolicy: IfNotPresent

  auth:
    username: vibops
    database: vibops

  # Row level security (ADR 0047). The application connects as `vibops_app`, a
  # role with no superuser and no BYPASSRLS, so the tenant policies actually
  # apply to it — forty-seven tables at the time of writing, and the list the
  # code owns is `core/app/models/_rls.py`, not this comment. Migrations keep the owner connection — they need DDL,
  # and a data migration has to reach every tenant.
  #
  # Set to false to put the application back on the owner role. That does not
  # remove the policies, it removes their effect: the rollback if an isolation
  # bug ever locks a legitimate read out.
  appRole:
    enabled: true
    # Generated on first install and kept for the life of the release. Set it
    # only to impose your own, and only at install time: the server is
    # initialised with it, and changing it later would leave the server on the
    # password it was created with.
    password: ""

  persistence:
    size: 20Gi
    storageClass: ""   # empty = the cluster default

  # Backups of the bundled database. Enabled by default, because a database
  # with no backup is not a default anyone chooses deliberately — and that is
  # what this chart shipped until v0.51.3: `postgresql.enabled: true` deployed
  # a StatefulSet and nothing dumped it. The manual's enterprise path sets
  # `postgresql.enabled: false` and delegates to a managed database that backs
  # itself up; every other install had no backup at all.
  #
  # A nightly dump on a volume of its own, kept 30 days, verified to contain
  # tables before the old ones are pruned. It covers human error and logical
  # corruption; it does not cover losing the cluster — ADR 0048 names that gap,
  # and the off-host copy is what closes it.
  backup:
    enabled: true

    # `postgres:16`, Debian — not the `16-alpine` the server runs.
    #
    # It is the only way to have `pg_dump` and a crypto tool in one process,
    # and that matters: with two containers the cleartext archive had to be
    # written to the backup volume and then unlinked, and an unlinked file is
    # not an erased one. Its blocks stay readable on the device until something
    # overwrites them — and a stolen disk is exactly what the encryption below
    # exists for. Measured on 03/10/2026: `postgres:16-alpine` carries neither
    # openssl, gpg nor age; `alpine` carries none either; and our own core
    # image has openssl but no `pg_dump`.
    #
    # The SERVER stays on alpine. Debian is glibc, Alpine is musl, and changing
    # libc under an existing data directory can change collation ordering and
    # leave indexes wrong. This container never touches the data directory — it
    # speaks the wire protocol — so the difference costs nothing here.
    #
    # An air-gapped site therefore mirrors two postgres images.
    image:
      repository: postgres
      # Pinned by digest, like the server's: a tag is a moving pointer.
      tag: "16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54"
      pullPolicy: IfNotPresent
    # 02:30 UTC. Deliberately not midnight: that is when every other scheduled
    # job in a cluster fires.
    schedule: "30 2 * * *"
    retentionDays: 30
    # The dump volume, separate from the database's. A backup on the database's
    # own disk does not survive the loss of that disk.
    size: 20Gi
    storageClass: ""   # empty = inherits persistence.storageClass, then the default

    # ── Encryption of the archives ────────────────────────────────────────────
    #
    # On by default, because a product should be safe by default and because
    # the copy below sends tenant data to an object store. ADR 0048 had named
    # this since it was written: the dumps held every tenant's data in the
    # clear, and the off-host copy made that true in two places instead of one.
    #
    # AES-256-CBC through `openssl`, PBKDF2 with 600 000 iterations. The
    # encrypting step runs in the vibops-core image, which carries OpenSSL —
    # `postgres:16-alpine` carries no crypto tool at all, and neither does
    # `alpine`. No new third-party image was introduced for this: the two the
    # chart already depended on taught that lesson (Bitnami pruned its free
    # catalogue, MinIO put its images behind a login).
    #
    # It gives confidentiality, not authenticity — `openssl enc` refuses AEAD
    # modes. A stolen disk, a forgotten snapshot or a misconfigured bucket are
    # covered; an adversary who can rewrite the ciphertext is not. Corruption
    # IS caught: a single altered byte makes `gzip` fail on restore.
    #
    # ⚠ THE KEY IS GENERATED HERE AND LIVES NOWHERE ELSE. Deleting the
    # namespace destroys it, while the backup volume and every off-host copy
    # survive — leaving archives nobody can open. Export it on the day you
    # install; `helm status` prints the command, and the installation guide
    # makes it a step.
    encryption:
      enabled: true

      # A Secret you created yourself, with a BACKUP_PASSPHRASE key. Use it to
      # keep the key under your own management rather than the chart's.
      existingSecret: ""

      # Or impose the passphrase at install time. Left empty the chart
      # generates one and preserves it for the life of the release.
      passphrase: ""

      # PBKDF2 iterations. Raise it, never lower it: an archive records the
      # count it was written with, so lowering this weakens new archives
      # without touching old ones.
      iterations: 600000

    # ── The copy off the cluster ──────────────────────────────────────────────
    #
    # ADR 0048 calls this its largest gap, and it was the right call: the dump
    # above sits on cloud storage in the database's own region, so a lost
    # region loses the database and every backup of it together. This is what
    # closes that.
    #
    # Off by default, and it cannot be otherwise — the destination is yours and
    # no default can invent it. Turning it on requires a `path` and either an
    # `existingSecret` or a `config` map; the chart refuses to render without
    # them rather than deploy a job that copies nowhere.
    #
    # The transport is rclone, configured entirely through its own environment
    # variables, so the chart models no provider: S3 (every cloud), SFTP to
    # another machine, Azure Blob, Google Cloud Storage, Backblaze — whatever
    # rclone supports works here with no chart change.
    #
    # docs/installation.md, Option C, "Backups", carries the keys for the
    # common targets and the restore path.
    remote:
      enabled: false

      # Bucket and prefix, e.g. "acme-vibops-backups/prod". No leading slash.
      path: ""

      # A Secret you created yourself, holding RCLONE_CONFIG_OFFSITE_* keys.
      # Preferred: nothing lands in a values file, in `helm get values`, or in
      # the release history.
      existingSecret: ""

      # Or the same keys inline, which the chart renders into a Secret of its
      # own. Convenient for a pilot; the credential then lives in the release
      # history for as long as the release does.
      #
      #   config:
      #     RCLONE_CONFIG_OFFSITE_TYPE: s3
      #     RCLONE_CONFIG_OFFSITE_PROVIDER: Other
      #     RCLONE_CONFIG_OFFSITE_ENDPOINT: https://s3.gra.io.cloud.ovh.net
      #     RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ...
      #     RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ...
      config: {}

      # Defaults to the local retentionDays above. Set it longer to keep more
      # history off-site than on the cluster's volume, which is the usual shape.
      retentionDays: ""

      # rclone, pinned by digest like the two other third-party images in this
      # chart: a tag is a moving pointer, a digest is the content. An air-gapped
      # site gets this image in the delivery archive whether or not it turns the
      # copy on — `scripts/package-delivery.sh` renders the chart both ways,
      # because discovering a missing image at 02:30 is not a discovery anyone
      # wants to make.
      image:
        repository: rclone/rclone
        tag: "1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5"
        pullPolicy: IfNotPresent

  # Upgrading a release whose data still sits in the Bitnami subchart's volume
  # is refused, because it would start an empty database and leave the old one
  # on disk with nobody told. Set this to true once your dump is taken —
  # docs/runbooks/upgrade-migration.md, section v0.45.7.
  legacyAcknowledged: false

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# ── HPA (désactivé par défaut — activer avec values.ha.yaml) ─────────────────
autoscaling:
  enabled: false
  core:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  agent:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60

# ── PodDisruptionBudget (désactivé par défaut) ────────────────────────────────
# Only useful once something runs more than one replica. With replicas=1 and
# minAvailable=1 the budget allows zero disruptions, so `kubectl drain` on the
# node holding that pod blocks until its timeout and the node never drains —
# measured on a three-node cluster on 21/09/2026, where core and console both
# refused eviction for the full 100 s. Enable it together with autoscaling, or
# raise the replica counts first.
podDisruptionBudget:
  enabled: false
  core:
    minAvailable: 1
  agent:
    minAvailable: 1
  console:
    minAvailable: 1

# ── Prometheus ServiceMonitor (nécessite prometheus-operator) ────────────────
serviceMonitor:
  enabled: false          # activer si kube-prometheus-stack est installé
  interval: "30s"
  path: /metrics          # exposé par prometheus-fastapi-instrumentator

# ── Grafana Dashboard (nécessite kube-prometheus-stack + sidecar dashboards) ─
grafanaDashboard:
  enabled: false          # activer si grafana sidecar est configuré (label grafana_dashboard: "1")
  namespace: ""           # défaut: même namespace que la release (ou "monitoring" si Grafana est ailleurs)

# ── Security Context (applied to all pods) ───────────────────────────────────
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# ── Alembic initContainer resources ──────────────────────────────────────────
alembicInit:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ── Network Policies ─────────────────────────────────────────────────────────
networkPolicy:
  enabled: true

# ── ServiceAccount ────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}
