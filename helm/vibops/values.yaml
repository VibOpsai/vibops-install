# VibOps Helm Chart — values par défaut
# Surcharger avec: helm install vibops ./helm/vibops -f my-values.yaml

global:
  imageRegistry: ""          # ex: registry.mycompany.com
  imagePullSecrets: []

# ── Registry credentials (private OCI registry) ───────────────────────────────
# Creates a kubernetes.io/dockerconfigjson Secret and injects it as imagePullSecret
imageCredentials:
  enabled: true
  registry: ghcr.io
  username: vibops-deploy    # pull-only service account
  password: ""               # set in values.secret.yaml (SOPS-encrypted)

# ── Images ────────────────────────────────────────────────────────────────────
# Le nom publie est `ghcr.io/<owner>/vibops-<composant>` — voir
# .github/workflows/release-images.yml, ou REGISTRY vaut
# `ghcr.io/${{ github.repository_owner }}/vibops` et le nom du composant est
# accole avec un tiret. `ghcr.io/vibops/core` n'a jamais existe : un chart qui
# le reference s'installe sans erreur et reste bloque en ImagePullBackOff.
#
# tag vide = la version applicative du chart (appVersion), comme
# charts/vibops-connect. Poser "latest" ici ferait ignorer appVersion et
# livrerait une version differente de celle que le chart annonce.
images:
  core:
    repository: ghcr.io/davidmacamara-boop/vibops-core
    tag: ""
    pullPolicy: IfNotPresent
  agent:
    repository: ghcr.io/davidmacamara-boop/vibops-agent
    tag: ""
    pullPolicy: IfNotPresent
  console:
    repository: ghcr.io/davidmacamara-boop/vibops-console
    tag: ""
    pullPolicy: IfNotPresent

# ── Namespace ─────────────────────────────────────────────────────────────────
namespaceOverride: ""   # défaut: release namespace

# ── Core (Execution Engine) ───────────────────────────────────────────────────
core:
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

  service:
    type: ClusterIP
    port: 8000

  env:
    APP_ENV: production
    OTEL_EXPORTER_OTLP_ENDPOINT: ""   # ex: http://otel-collector:4317
    # Surcharger les secrets via core.secret.*

  secret:
    secretKey: ""          # REQUIRED when APP_ENV=production — Fernet key
    jwtSecretKey: ""       # REQUIRED when APP_ENV=production — openssl rand -hex 32
    authUsername: "admin"
    authPasswordHash: ""   # vide = auth désactivée
    databaseUrl: ""        # auto-généré si postgresql.enabled
    redisUrl: ""           # REQUIRED in production — e.g. redis://<redis-host>:6379/0
    vaultKey: ""           # REQUIRED when APP_ENV=production — Fernet key — python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    internalApiKey: ""     # REQUIRED when APP_ENV=production — service-to-service auth — python -c "import secrets; print(secrets.token_hex(32))"
    # REQUIRED in production — core refuses to start without them, since an
    # empty webhook secret accepts any source. Generate with `openssl rand -hex 32`.
    githubWebhookSecret: ""
    grafanaWebhookSecret: ""
    # Licence VibOps — laisser vide pour trial 14 jours
    # Obtenir une clé : contacter david@vibops.ai
    # La clé est un JWT RS256 signé par VibOps. Aucun secret partagé requis côté client.
    licenceKey: ""

  # Kubeconfig multi-cluster — monté dans le pod core pour le sélecteur de contexte
  # Créer le secret avec : kubectl create secret generic vibops-kubeconfig \
  #   --from-file=config=$HOME/.kube/config -n vibops
  kubeconfig:
    secretName: ""          # nom du secret K8s contenant la clé "config"
    mountPath: /home/vibops/.kube  # chemin de montage dans le pod

# ── Worker (Celery) ──────────────────────────────────────────────────────────
worker:
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

# ── Agent ─────────────────────────────────────────────────────────────────────
agent:
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

  service:
    type: ClusterIP
    port: 8001

  persistence:
    enabled: true
    size: 10Gi
    storageClassName: standard   # remplacer par efs-sc (AWS) ou nfs-client (GCP)
    accessMode: ReadWriteOnce    # ReadWriteMany si plusieurs replicas (EFS)

  env:
    # LLM provider: claude (default) | openai (on-prem: vLLM, Mistral…) | ollama | nemotron
    LLM_PROVIDER: "claude"
    # Model name — interpreted by the active provider
    # claude:   claude-sonnet-4-6, claude-opus-4-6
    # openai:   glm-4, mistral-7b, llama3
    # ollama:   llama3:8b, mistral:7b
    # nemotron: nvidia/llama-3.1-nemotron-ultra-253b-v1
    LLM_MODEL: "claude-sonnet-4-6"
    # On-prem OpenAI-compatible endpoint (required when LLM_PROVIDER=openai)
    LLM_BASE_URL: ""      # e.g. http://glm-service.ai-infra.svc:8000/v1 (openai provider only)
    LLM_API_KEY: ""       # set here only if not using secret.llmApiKey
    # Ollama endpoint (required when LLM_PROVIDER=ollama)
    OLLAMA_BASE_URL: "http://ollama:11434"
    # NVIDIA NIM endpoint (required when LLM_PROVIDER=nemotron)
    NEMOTRON_BASE_URL: "http://nim:8000/v1"

  secret:
    # API key for the active LLM provider.
    # - claude (Anthropic): get a key at https://console.anthropic.com/settings/keys
    # - openai / on-prem: your provider's API key (leave empty if no auth required)
    # - ollama / nemotron: leave empty (on-prem NIM needs no auth)
    llmApiKey: ""
    # Base URL — required only when LLM_PROVIDER=openai (on-prem endpoint).
    # Example: http://vllm-service.ai-infra.svc:8000/v1
    # Leave empty for claude, ollama, or nemotron.
    llmBaseUrl: ""
    # Leave empty: it then takes core.secret.jwtSecretKey. The agent validates
    # tokens core signs, so two different values is a silent 401, not a warning.
    jwtSecretKey: ""

# ── Console (UI) ──────────────────────────────────────────────────────────────
console:
  # Conversation history lives in SQLite at /data. Without this the console
  # cannot write at all under readOnlyRootFilesystem, and an emptyDir would
  # discard every conversation on restart — which the compose deployment never
  # did, since it mounts a named volume there.
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""   # empty = the cluster's default
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  service:
    type: ClusterIP
    port: 8003

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  host: vibops.example.com
  tls: []
  # tls:
  #   - secretName: vibops-tls
  #     hosts:
  #       - vibops.example.com

# ── PostgreSQL (Bitnami sub-chart) ────────────────────────────────────────────
# ── Redis (Celery broker) ────────────────────────────────────────────────────
# Bundled like PostgreSQL. The chart used to ship the database and not the
# broker, while core.secret.redisUrl said "REQUIRED in production" and defaulted
# to localhost — so an install following the guide never became healthy, and
# nothing explained why one stateful dependency was bundled and the other not.
#
# The official image rather than a Bitnami subchart: Bitnami pruned its free
# Docker Hub catalogue, which is exactly what broke PostgreSQL here on
# 20/09/2026.
redis:
  enabled: true
  auth:
    password: ""   # REQUIRED — openssl rand -hex 24
  image:
    repository: redis
    tag: "7-alpine"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

postgresql:
  enabled: true

  # Bitnami pruned its free Docker Hub catalogue: the tag chart 15.5.x pins by
  # default — `bitnami/postgresql:16.4.0-debian-12-r14` — returns "not found",
  # and every pod that waits on the database crashes behind it. Found on
  # 20/09/2026 by installing this chart on a cluster; `helm template` and
  # `--dry-run=server` both pass, because neither pulls anything.
  #
  # The surviving copy lives under `bitnamilegacy`. It works and it is frozen:
  # that repository receives no updates, security ones included. This is a
  # stopgap, not a resting place — see docs/harness.md, Known gaps.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.4.0-debian-12-r14

  auth:
    username: vibops
    # Optional. Left empty, the subchart generates one on install and keeps it
    # on upgrade; core reads it from the subchart's Secret at start-up, so the
    # two cannot disagree. Set it only if you need to choose the password
    # yourself — and then keep passing it on every upgrade, or the subchart
    # will rotate it while the server keeps the old one.
    password: ""
    database: vibops
  primary:
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "512Mi"

# ── HPA (désactivé par défaut — activer avec values.ha.yaml) ─────────────────
autoscaling:
  enabled: false
  core:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  agent:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60

# ── PodDisruptionBudget (désactivé par défaut) ────────────────────────────────
podDisruptionBudget:
  enabled: false
  core:
    minAvailable: 1
  agent:
    minAvailable: 1
  console:
    minAvailable: 1

# ── Prometheus ServiceMonitor (nécessite prometheus-operator) ────────────────
serviceMonitor:
  enabled: false          # activer si kube-prometheus-stack est installé
  interval: "30s"
  path: /metrics          # exposé par prometheus-fastapi-instrumentator

# ── Grafana Dashboard (nécessite kube-prometheus-stack + sidecar dashboards) ─
grafanaDashboard:
  enabled: false          # activer si grafana sidecar est configuré (label grafana_dashboard: "1")
  namespace: ""           # défaut: même namespace que la release (ou "monitoring" si Grafana est ailleurs)

# ── Security Context (applied to all pods) ───────────────────────────────────
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# ── Alembic initContainer resources ──────────────────────────────────────────
alembicInit:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ── Network Policies ─────────────────────────────────────────────────────────
networkPolicy:
  enabled: true

# ── ServiceAccount ────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}
